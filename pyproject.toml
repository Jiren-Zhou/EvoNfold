[project]
name = "pkfold"
version = "0.1.0"
description = "PKfold inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pkfold*"]
