[project]
name = "pcfold"
version = "0.1.0"
description = "PCfold inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15.0.0",
    "torch>=2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcfold*"]
